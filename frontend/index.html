<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>COFRAP - Portail Utilisateur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header role="banner">
        <h1 style="text-align: center;">Portail COFRAP (PoC Serverless)</h1>
    </header>

    <main role="main">
        <section class="container" aria-labelledby="titre-creation">
            <h2 id="titre-creation">1. Créer un compte (Génération Mot de Passe)</h2>
            <input type="text" id="reg-username" placeholder="Nom d'utilisateur" aria-label="Saisir le nom d'utilisateur pour la création de compte">
            <button onclick="createAccount()">Créer le compte</button>
            <div id="reg-result" class="result" style="display:none;" aria-live="polite" aria-atomic="true"></div>
        </section>

        <section class="container" aria-labelledby="titre-2fa">
            <h2 id="titre-2fa">2. Activer le 2FA (Double Authentification)</h2>
            <input type="text" id="mfa-username" placeholder="Nom d'utilisateur" aria-label="Saisir le nom d'utilisateur pour générer le QR Code 2FA">
            <button onclick="generate2FA()">Générer le QR Code 2FA</button>
            <div id="mfa-result" class="result" style="display:none;" aria-live="polite" aria-atomic="true"></div>
        </section>

        <section class="container" aria-labelledby="titre-auth">
            <h2 id="titre-auth">3. S'authentifier</h2>
            <input type="text" id="auth-username" placeholder="Nom d'utilisateur" aria-label="Saisir votre nom d'utilisateur">
            <input type="password" id="auth-password" placeholder="Mot de passe (24 caractères)" aria-label="Saisir votre mot de passe généré">
            <input type="text" id="auth-totp" placeholder="Code 2FA (6 chiffres)" aria-label="Saisir le code à 6 chiffres de votre application 2FA">
            <button onclick="login()">Connexion</button>
            <div id="auth-result" class="result" style="display:none;" aria-live="polite" aria-atomic="true"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
