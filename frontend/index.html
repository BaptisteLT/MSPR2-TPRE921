<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>COFRAP - Portail Utilisateur</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #333; border-bottom: 2px solid #007BFF; padding-bottom: 5px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .result { padding: 10px; background-color: #e9ecef; border-radius: 4px; word-break: break-all; }
        img { display: block; margin: 10px auto; max-width: 200px; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Portail COFRAP (PoC Serverless)</h1>

    <div class="container">
        <h2>1. Créer un compte (Génération Mot de Passe)</h2>
        <input type="text" id="reg-username" placeholder="Nom d'utilisateur">
        <button onclick="createAccount()">Créer le compte</button>
        <div id="reg-result" class="result" style="display:none;"></div>
    </div>

    <div class="container">
        <h2>2. Activer le 2FA (Double Authentification)</h2>
        <input type="text" id="mfa-username" placeholder="Nom d'utilisateur">
        <button onclick="generate2FA()">Générer le QR Code 2FA</button>
        <div id="mfa-result" class="result" style="display:none;"></div>
    </div>

    <div class="container">
        <h2>3. S'authentifier</h2>
        <input type="text" id="auth-username" placeholder="Nom d'utilisateur">
        <input type="password" id="auth-password" placeholder="Mot de passe (24 caractères)">
        <input type="text" id="auth-totp" placeholder="Code 2FA (6 chiffres)">
        <button onclick="login()">Connexion</button>
        <div id="auth-result" class="result" style="display:none;"></div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8080/function"; // L'adresse de ton OpenFaaS local

        // Fonction 1 : Appel de cofrap-gen-pwd
        async function createAccount() {
            const username = document.getElementById('reg-username').value;
            const resDiv = document.getElementById('reg-result');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "Création en cours...";

            try {
                const response = await fetch(`${API_URL}/cofrap-gen-pwd`, {
                    method: 'POST',
                    body: JSON.stringify({ username: username })
                });
                const data = await response.json();
                
                if(data.error) {
                    resDiv.innerHTML = `<span style="color:red">${data.error}</span>`;
                } else {
                    resDiv.innerHTML = `
                        <strong style="color:green">${data.message}</strong><br>
                        Votre mot de passe généré : <b>${data.password}</b><br>
                        <img src="data:image/png;base64,${data.qr_code_base64}" alt="QR Code Password" />
                    `;
                }
            } catch (err) { resDiv.innerHTML = "Erreur de connexion à l'API OpenFaaS."; }
        }

        // Fonction 2 : Appel de cofrap-gen-2fa
        async function generate2FA() {
            const username = document.getElementById('mfa-username').value;
            const resDiv = document.getElementById('mfa-result');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "Génération en cours...";

            try {
                const response = await fetch(`${API_URL}/cofrap-gen-2fa`, {
                    method: 'POST',
                    body: JSON.stringify({ username: username })
                });
                const data = await response.json();
                
                if(data.error) {
                    resDiv.innerHTML = `<span style="color:red">${data.error}</span>`;
                } else {
                    resDiv.innerHTML = `
                        <strong style="color:green">${data.message}</strong><br>
                        Scannez ce QR Code dans Google Authenticator :<br>
                        <img src="data:image/png;base64,${data.qr_code_2fa_base64}" alt="QR Code 2FA" />
                    `;
                }
            } catch (err) { resDiv.innerHTML = "Erreur de connexion à l'API OpenFaaS."; }
        }

        // Fonction 3 : Appel de cofrap-auth
        async function login() {
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            const totp = document.getElementById('auth-totp').value;
            const resDiv = document.getElementById('auth-result');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "Vérification...";

            try {
                const response = await fetch(`${API_URL}/cofrap-auth`, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        username: username, 
                        password: password, 
                        totp_code: totp 
                    })
                });
                const data = await response.json();
                
                if(data.error) {
                    resDiv.innerHTML = `<span style="color:red">Erreur : ${data.error}</span>`;
                } else {
                    resDiv.innerHTML = `<strong style="color:green">${data.message}</strong>`;
                }
            } catch (err) { resDiv.innerHTML = "Erreur de connexion à l'API OpenFaaS."; }
        }
    </script>
</body>
</html>
